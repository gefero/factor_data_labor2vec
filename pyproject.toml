[project]
name = "labor2vec"
version = "0.1.0"
description = "Adaptación de life2vec (Savcisens et al., 2023) a la Muestra Longitudinal de Empleo Registrado (MLER)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.10",
    "pyarrow>=17",
    "numpy>=2.1",
    "openpyxl>=3.1",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Modelo. torch se instala con un extra que elige el índice de PyTorch:
#   local (CPU, desarrollo):  uv sync --extra cpu
#   Mendieta (A30, sm_80):    uv sync --extra cu126
modelo = [
    "lightning>=2.4",
    "torchmetrics>=1.4",
    "performer-pytorch>=1.1.4",
]
cpu = ["torch==2.11.0", "labor2vec[modelo]"]
cu126 = ["torch==2.11.0", "labor2vec[modelo]"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labor2vec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# performer-pytorch usa distutils.LooseVersion
filterwarnings = ["ignore::DeprecationWarning:performer_pytorch"]

[tool.ruff]
line-length = 110
