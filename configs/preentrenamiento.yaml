# Pre-entrenamiento MLM + SOP. Se sobrescribe desde la línea de comandos: --set entrenamiento.epocas=5
semilla: 0

datos:
  corpus: data/processed/corpus
  fin_ventana: 239            # último mes_idx incluido (239 = 2015-12); null = toda la historia
  eventos_compactos: false    # variante B
  max_length: 2560
  tamano_lote: 64
  num_workers: 4              # 10 cores por GPU en Mendieta; 0 en las pruebas locales

# Sobrescribe HPARAMS_PAPER (modelo/config.py). vocab_size y n_tokens_fondo salen del vocabulario y del documento.
modelo:
  sop_proporciones: [0.9, 0.05, 0.05]   # normal / invertido / mezclado

entrenamiento:
  salida: runs/preentrenamiento
  precision: bf16-mixed       # 32-true | bf16-mixed
  epocas: 3                   # una época = una pasada por train; el calendario final se fija en la fase 4
  pasos_por_epoca: null       # tope de pasos por época (null = pasada completa)
  val_cada_pasos: null        # validar cada N pasos (null = al final de cada época)
  val_lotes: 200              # lotes de validación por época (null = todos)
  clip_gradiente: null
  guardar_cada_pasos: 500
  log_cada_pasos: 10
  muestra_unigrama: 20000     # documentos de train para la línea de base unigrama
